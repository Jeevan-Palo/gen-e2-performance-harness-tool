meta:
  client: HRM
  application: orangehrm
  version: '0.1'
  date: ''
  brd_owner: ''
  prepared_by: ''
  status: Draft
  open_items_decision: ''
purpose: Validate HR self-service response times before the monthly payroll and leave-approval peak, when all employees log in during the first working day of the month
objectives: []
scope_in:
- 'OrangeHRM web app: login, dashboard, employee list (PIM), employee search, leave list'
scope_out:
- Admin configuration
- Reports export
- Mobile app
stakeholders:
- role: Business owner
  name: ''
  responsibility: Owns requirements and accepts results
- role: Environment owner
  name: ''
  responsibility: Authorises testing in the target environment
- role: Operations / support contact
  name: ''
  responsibility: Agrees stop conditions, informed before and during runs
- role: Performance test lead
  name: ''
  responsibility: Plans and runs the test, reports results
- role: Development / architecture contact
  name: ''
  responsibility: Supports diagnosis and fixes
transactions:
- id: T1
  name: Login
  user_type: Registered employee (demo admin account)
  criticality: ''
  traffic_share: 25%
  flow: Login
  measure_start_end: From the user action (click or page request) until the next page is fully loaded
  notes: ''
- id: T2
  name: Open employee list (PIM)
  user_type: Registered employee (demo admin account)
  criticality: ''
  traffic_share: 25%
  flow: Open employee list (PIM)
  measure_start_end: From the user action (click or page request) until the next page is fully loaded
  notes: ''
- id: T3
  name: Search employee by name
  user_type: Registered employee (demo admin account)
  criticality: ''
  traffic_share: 25%
  flow: Search employee by name
  measure_start_end: From the user action (click or page request) until the next page is fully loaded
  notes: ''
- id: T4
  name: Open leave list
  user_type: Registered employee (demo admin account)
  criticality: ''
  traffic_share: 25%
  flow: Open leave list
  measure_start_end: From the user action (click or page request) until the next page is fully loaded
  notes: ''
workload:
  peak_concurrent_users: Up to the environment limit (5 concurrent users), stepped; real peak to be confirmed from analytics
  peak_tps: ''
  peak_window: Busiest business hour; tested as 5 min ramp-up, 20 min steady load, 5 min ramp-down
  avg_daily_volume: ''
  growth_12m: ''
  think_time: 5 seconds between user actions
  geography: ''
  data_volumes: ''
  basis: assumed
requirements:
- id: PR-01
  transaction: T1
  metric: Response time
  target: <= 3 s
  percentile: p95
  load_condition: peak load
  priority: Must
- id: PR-02
  transaction: T2
  metric: Response time
  target: <= 3 s
  percentile: p95
  load_condition: peak load
  priority: Must
- id: PR-03
  transaction: T3
  metric: Response time
  target: <= 3 s
  percentile: p95
  load_condition: peak load
  priority: Must
- id: PR-04
  transaction: T4
  metric: Response time
  target: <= 3 s
  percentile: p95
  load_condition: peak load
  priority: Must
- id: PR-05
  transaction: All
  metric: Error rate
  target: <= 1%
  percentile: n/a
  load_condition: peak load
  priority: Must
test_types:
- type: Baseline (single user)
  needed: 'yes'
  notes: ''
- type: Load
  needed: 'yes'
  notes: ''
- type: Stress
  needed: 'no'
  notes: ''
- type: Spike
  needed: 'no'
  notes: ''
- type: Endurance (soak)
  needed: 'no'
  notes: ''
- type: Scalability
  needed: 'no'
  notes: ''
environment:
  target: ''
  owner: ''
  comparison_with_production: ''
  third_party_services: ''
  test_data: ''
  personal_data_confirmation: 'Yes: only synthetic test data is used; no real personal or payment data'
  monitoring_access: ''
  test_windows: ''
abort_conditions:
- condition: Error rate
  threshold: '> 5% for 2 consecutive minutes'
  action: Stop the test and notify the environment owner
- condition: Response time
  threshold: p95 > 10 s for 2 consecutive minutes
  action: Stop the test
- condition: Throttling or blocking
  threshold: Any 429, 503 or WAF/CDN block response
  action: Stop immediately
- condition: Request from operations or environment owner
  threshold: Any stop request
  action: Stop immediately
monitoring_reporting:
  metrics: ''
  tools: ''
  interim_updates: ''
  final_report: ''
risks:
- type: ''
  description: ''
  owner: ''
  impact: ''
- type: Assumption
  description: 'Advised values accepted by the user in place of client figures: workload.peak_window, workload.think_time, workload.basis, transactions[].traffic_share, transactions[].measure_start_end,
    requirements, test_types, abort_conditions, environment.personal_data_confirmation, environments.yaml test_data, environments.yaml test_windows, workload.peak_concurrent_users.'
  owner: Test lead
  impact: Results show behaviour under advised settings; confirm with the client before sign-off
