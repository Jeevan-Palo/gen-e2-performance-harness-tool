notes:
- "API-001 (login) requires a per-session _token (CSRF) read from a hidden field on the login page HTML itself, not from another API response - must GET the login page first to extract it before POSTing to /auth/validate."
- "core/i18n/messages and events/push same-host calls were seen but excluded: they are app bootstrap/telemetry, not business transactions."
- "Write flows (Apply Leave, Add Employee, Record Claim, etc.) were not discovered - read-only browser discovery only, per api-discovery-browser safety rules."
- "meta.base_url is intentionally left empty here; the run target comes from environments.yaml (active environment 'demo'). NOTE: environments.yaml demo.base_url is currently a full page path (/web/index.php/auth/login), not a bare origin - flagged to the user for confirmation before the k6 script step."
