# Copy to projects/<client>/<app>/brd.yaml. Leave unknown values empty ("" or []). Never guess.
meta:
  client: "HRM"
  application: "OrangeHRM Live (opensource-demo.orangehrmlive.com)"
  version: "0.1"
  date: "2026-11-18"  # YYYY-MM-DD
  brd_owner: ""       # client BRD owner, name and title
  prepared_by: ""
  status: "Draft"     # Draft | In review | Approved (Approved only by client)
purpose: ""           # why performance testing now (business event or risk)
objectives: []        # e.g. "Confirm response-time targets at expected peak load"
scope_in: []          # applications, services, interfaces, user journeys
scope_out: []
stakeholders:         # business owner, environment owner, operations contact, test lead, dev contact
  - {role: "Business owner", name: "", responsibility: "Owns requirements and accepts results"}
  - {role: "Environment owner", name: "", responsibility: "Authorises testing in the target environment"}
  - {role: "Operations / support contact", name: "", responsibility: "Agrees stop conditions, informed before and during runs"}
  - {role: "Performance test lead", name: "", responsibility: "Plans and runs the test, reports results"}
  - {role: "Development / architecture contact", name: "", responsibility: "Supports diagnosis and fixes"}
transactions:         # one entry per business transaction
  - {id: "T1", name: "Login", user_type: "Registered user", criticality: "", traffic_share: "", flow: "Submit username and password on the login page", measure_start_end: "Start: login request sent; End: redirect to dashboard received", notes: "Candidate transaction from browser discovery; criticality and traffic share not yet confirmed by the business"}
  - {id: "T2", name: "View dashboard", user_type: "Authenticated user", criticality: "", traffic_share: "", flow: "Load the dashboard after login (widgets: time at work, action summary, shortcuts, buzz feed, leaves, employee distribution)", measure_start_end: "Start: dashboard page requested; End: all dashboard widget responses received", notes: "Candidate transaction from browser discovery; criticality and traffic share not yet confirmed by the business"}
  - {id: "T3", name: "View employee list (PIM)", user_type: "Authenticated user", criticality: "", traffic_share: "", flow: "Open PIM module and view the employee list with its filter lookups", measure_start_end: "Start: employee list page requested; End: employee list response received", notes: "Candidate transaction from browser discovery; criticality and traffic share not yet confirmed by the business"}
  - {id: "T4", name: "Browse employee directory", user_type: "Authenticated user", criticality: "", traffic_share: "", flow: "Open the Directory module and view the employee directory", measure_start_end: "Start: directory page requested; End: directory response received", notes: "Candidate transaction from browser discovery; criticality and traffic share not yet confirmed by the business"}
workload:
  peak_concurrent_users: ""   # state whether sitewide or per transaction
  peak_tps: ""
  peak_window: ""             # e.g. 18:00 to 22:00, 4 hours
  avg_daily_volume: ""
  growth_12m: ""
  think_time: ""
  geography: ""
  data_volumes: ""
  basis: ""                   # measured | forecast | assumed
requirements:         # each must be measurable
  - {id: "PR-01", transaction: "", metric: "", target: "", percentile: "", load_condition: "", priority: ""}
test_types:           # needed: yes | no
  - {type: "Baseline (single user)", needed: "", notes: ""}
  - {type: "Load", needed: "", notes: ""}
  - {type: "Stress", needed: "", notes: ""}
  - {type: "Spike", needed: "", notes: ""}
  - {type: "Endurance (soak)", needed: "", notes: ""}
  - {type: "Scalability", needed: "", notes: ""}
environment:
  target: ""
  owner: ""
  comparison_with_production: ""
  third_party_services: ""    # real, stubbed or virtualised, and who approves
  test_data: ""               # accounts, products, volumes, refresh method
  personal_data_confirmation: ""   # confirm masked or synthetic data only
  monitoring_access: ""       # APM/infra/logs/db and who grants access
  test_windows: ""
abort_conditions:     # must be agreed with operations
  - {condition: "Error rate", threshold: "", action: ""}
  - {condition: "Response time", threshold: "", action: ""}
  - {condition: "Server health", threshold: "", action: ""}
  - {condition: "Impact on other systems or users", threshold: "", action: ""}
  - {condition: "Request from operations or environment owner", threshold: "", action: ""}
monitoring_reporting:
  metrics: ""
  tools: ""
  interim_updates: ""
  final_report: ""
risks:                # type: Assumption | Constraint | Dependency | Risk
  - {type: "Assumption", description: "Transactions T1-T4 (Login, View dashboard, View employee list, Browse employee directory) were picked by the test lead during browser discovery, not stated by a business owner; other flows (Admin, Leave, Time, Recruitment, Performance, Maintenance, Claim, Buzz) exist but were not explored.", owner: "", impact: ""}
exit_criteria: []
open_items:           # {question, owner, due, status}
  - {question: "Confirm criticality and traffic share for T1-T4, and whether these are the right transactions to test (vs. other unexplored modules: Admin, Leave, Time, Recruitment, Performance, Maintenance, Claim, Buzz).", owner: "", due: "", status: "Open"}
  - {question: "Write actions (e.g. Apply Leave, Add Employee, Record Claim) were not discovered - read-only discovery only. Confirm whether any write transaction is needed, and if so, get explicit approval before discovering it.", owner: "", due: "", status: "Open"}
approvals:            # filled by humans only
  - {name: "", role: "Business owner", decision: "", date: ""}
  - {name: "", role: "Environment owner", decision: "", date: ""}
  - {name: "", role: "Operations contact", decision: "", date: ""}
evidence:
- field: meta.client
  source: user answer, 2026-11-18
- field: meta.application
  source: 'Browser page title "OrangeHRM" at https://opensource-demo.orangehrmlive.com/web/index.php/auth/login; project name given by user, 2026-11-18'
- field: transactions (T1-T4)
  source: 'Browser discovery, 2026-11-18: observed Login, Dashboard, PIM employee list and Directory pages/flows on the "demo" environment (environments.yaml)'
