# Environments for this project. Switch with: python tools/envconf.py use projects/HRM/orangehrmlive <name>
# NEVER put passwords, tokens or keys here. List only the NAMES of the environment variables that hold them.
active: demo
environments:
  demo:
    description: "OrangeHRM Live - public demo site (opensource-demo.orangehrmlive.com)"
    type: test
    base_url: "https://opensource-demo.orangehrmlive.com/web/index.php/auth/login"
    owner: "HRM"
    authorisation: accepted_by_test_lead
    authorisation_note: "Test. Today (recorded 2026-11-18)."
    max_vus: 5
    max_run_minutes: 5
    test_windows: "Any time"
    monitoring: {source: none, detail: ""}
    comparison_with_production: ""
    third_party_services: ""
    test_data: ""
    credentials_env_vars: []
    known_differences: ""
    verified: {date: "", by: "", note: ""}
