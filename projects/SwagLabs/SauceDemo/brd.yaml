# Copy to projects/<client>/<app>/brd.yaml. Leave unknown values empty ("" or []). Never guess.
meta:
  client: "SwagLabs"
  application: "SauceDemo"
  version: "0.1"
  date: ""            # YYYY-MM-DD
  brd_owner: ""       # client BRD owner, name and title
  prepared_by: ""
  status: "Draft"     # Draft | In review | Approved (Approved only by client)
  open_items_decision: "proceed_with_open_items"
purpose: "Performance testing is needed now to evaluate the application's response time, stability, and reliability under expected user traffic. It helps identify performance bottlenecks, detect potential issues before release, and ensure a smooth user experience."
objectives: []        # e.g. "Confirm response-time targets at expected peak load"
scope_out: []
scope_in:
  - "Browse the SauceDemo application"
stakeholders:         # business owner, environment owner, operations contact, test lead, dev contact
  - {role: "Business owner", name: "", responsibility: "Owns requirements and accepts results"}
  - {role: "Environment owner", name: "", responsibility: "Authorises testing in the target environment"}
  - {role: "Operations / support contact", name: "", responsibility: "Agrees stop conditions, informed before and during runs"}
  - {role: "Performance test lead", name: "", responsibility: "Plans and runs the test, reports results"}
  - {role: "Development / architecture contact", name: "", responsibility: "Supports diagnosis and fixes"}
transactions:         # one entry per business transaction
  - {id: "T1", name: "Login", user_type: "Guest/registered test user", criticality: "High", traffic_share: "25%", flow: "Open login page and submit a test login", measure_start_end: "From login page request start to inventory page load completion", notes: "Sample assumption"}
  - {id: "T2", name: "Browse products", user_type: "Registered test user", criticality: "High", traffic_share: "25%", flow: "Open inventory and browse product cards", measure_start_end: "From inventory request start to product page response completion", notes: "Sample assumption"}
  - {id: "T3", name: "Add to cart", user_type: "Registered test user", criticality: "High", traffic_share: "25%", flow: "Add a product in the browser-side cart", measure_start_end: "From add-to-cart action start to cart badge update", notes: "No load-safe network API observed; sample assumption"}
  - {id: "T4", name: "Checkout", user_type: "Registered test user", criticality: "High", traffic_share: "25%", flow: "Complete browser-side checkout", measure_start_end: "From checkout action start to completion page render", notes: "No load-safe network API observed; sample assumption"}
workload:
  peak_concurrent_users: "5 concurrent users across the whole site"
  peak_tps: ""
  peak_window: "Sample assumption: 30-minute test within an agreed window"
  avg_daily_volume: ""
  growth_12m: ""
  think_time: "3 seconds between user actions"
  geography: ""
  data_volumes: ""
  basis: "assumed"
requirements:         # each must be measurable
  - {id: "PR-01", transaction: "T1", metric: "Response time", target: "<= 2 s", percentile: "p95", load_condition: "100 concurrent users", priority: "Must"}
  - {id: "PR-02", transaction: "T2", metric: "Response time", target: "<= 2 s", percentile: "p95", load_condition: "100 concurrent users", priority: "Must"}
  - {id: "PR-03", transaction: "T3", metric: "Response time", target: "<= 2 s", percentile: "p95", load_condition: "100 concurrent users", priority: "Must"}
  - {id: "PR-04", transaction: "T4", metric: "Response time", target: "<= 3 s", percentile: "p95", load_condition: "100 concurrent users", priority: "Must"}
  - {id: "PR-05", transaction: "All", metric: "Error rate", target: "<= 1%", percentile: "n/a", load_condition: "peak load", priority: "Must"}
  - {id: "PR-06", transaction: "System", metric: "Stability", target: "maintain target load for 30 minutes without major degradation", percentile: "n/a", load_condition: "target load", priority: "Should", notes: "Deferred: sample run duration is not a stability proof"}
test_types:           # needed: yes | no
  - {type: "Baseline (single user)", needed: "yes", notes: ""}
  - {type: "Load", needed: "", notes: ""}
  - {type: "Stress", needed: "", notes: ""}
  - {type: "Spike", needed: "", notes: ""}
  - {type: "Endurance (soak)", needed: "", notes: ""}
  - {type: "Scalability", needed: "", notes: ""}
environment:
  target: "test: https://www.saucedemo.com/"
  owner: "Test lead"
  comparison_with_production: ""
  third_party_services: ""    # real, stubbed or virtualised, and who approves
  test_data: "Predefined SauceDemo test accounts; standard products in the public catalog. Volumes to be determined from scenarios. Reset application state and shopping carts between runs. No real personal or payment data."
  personal_data_confirmation: "Synthetic or masked data only"
  monitoring_access: ""       # APM/infra/logs/db and who grants access
  test_windows: "Sample assumption: off-peak 30-minute window"
abort_conditions:     # must be agreed with operations
  - {condition: "Error rate", threshold: "> 5% for 2 consecutive minutes", action: "Stop and notify operations"}
  - {condition: "Response time", threshold: "p95 > 10 s for 2 consecutive minutes", action: "Stop"}
  - {condition: "Server health", threshold: "Not available for public environment", action: "Stop if health source reports severe degradation"}
  - {condition: "Impact on other systems or users", threshold: "Sample assumption: any confirmed impact", action: "Stop immediately"}
  - {condition: "Request from operations or environment owner", threshold: "Any stop request", action: "Stop immediately"}
monitoring_reporting:
  metrics: ""
  tools: ""
  interim_updates: ""
  final_report: ""
risks:
  - {type: "Assumption", description: "25% sample traffic share assigned to each transaction because client shares were unavailable.", owner: "Test lead", impact: "Traffic mix may not represent production"}
  - {type: "Assumption", description: "Peak window and abort conditions use sample values and require client/operations approval.", owner: "Test lead", impact: "Results must not be claimed as approved requirements"}
  - {type: "Constraint", description: "Environment hard limit is 5 VUs; stated 100-VU targets cannot be executed under this setup.", owner: "Test lead", impact: "100-VU requirements remain untested"}
exit_criteria: []
open_items:           # {question, owner, due, status}
  - {question: "Confirm TPS if required in addition to 5 whole-site concurrent users.", owner: "", due: "", status: "Open"}
  - {question: "Confirm the peak window and duration; 'Proposed' is not a specific date/time or duration.", owner: "", due: "", status: "Open"}
  - {question: "Confirm allowed test windows, dates, times and any blackout periods.", owner: "", due: "", status: "Open"}
  - {question: "Confirm T1 traffic share.", owner: "", due: "", status: "Open"}
  - {question: "Confirm T1 response-time measurement start and end point.", owner: "", due: "", status: "Open"}
  - {question: "Confirm T2 traffic share.", owner: "", due: "", status: "Open"}
  - {question: "Confirm T2 response-time measurement start and end point.", owner: "", due: "", status: "Open"}
  - {question: "Confirm T3 traffic share.", owner: "", due: "", status: "Open"}
  - {question: "Confirm T3 response-time measurement start and end point.", owner: "", due: "", status: "Open"}
  - {question: "Confirm T4 traffic share.", owner: "", due: "", status: "Open"}
  - {question: "Confirm T4 response-time measurement start and end point.", owner: "", due: "", status: "Open"}
  - {question: "Resolve workload conflict: 5 whole-site concurrent users was stated while T1-T4 requirements apply at 100 concurrent users.", owner: "", due: "", status: "Open"}
  - {question: "Confirm abort thresholds and actions with operations; proposed values are not yet agreed.", owner: "", due: "", status: "Open"}
approvals:            # filled by humans only
  - {name: "", role: "Business owner", decision: "", date: ""}
  - {name: "", role: "Environment owner", decision: "", date: ""}
  - {name: "", role: "Operations contact", decision: "", date: ""}
evidence:
  - {field: "meta.client", source: "user answer, 2026-11-23"}
  - {field: "meta.application", source: "user answer, 2026-11-23"}
  - {field: "purpose", source: "user answer, 2026-11-23"}
  - {field: "scope_in", source: "user answer, 2026-11-23"}
  - {field: "workload.peak_concurrent_users", source: "user answer, 2026-11-23"}
  - {field: "workload.think_time", source: "user answer, 2026-11-23"}
  - {field: "workload.basis", source: "user answer, 2026-11-23"}
  - {field: "transactions.T1.name", source: "user answer, 2026-11-23"}
  - {field: "environment.test_data", source: "user answer, 2026-11-23"}
  - {field: "environment.personal_data_confirmation", source: "user answer, 2026-11-23"}
  - {field: "transactions.T1-T4", source: "user answer, 2026-11-23"}
  - {field: "requirements.PR-01-PR-06", source: "user answer, 2026-11-23"}
  - {field: "meta.open_items_decision", source: "user answer, 2026-11-23"}
  - {field: "workload.peak_window", source: "sample assumption supplied by Copilot, 2026-11-23"}
  - {field: "workload.basis", source: "sample assumption supplied by Copilot, 2026-11-23"}
  - {field: "transactions.T1-T4 traffic_share", source: "sample assumption supplied by Copilot, 2026-11-23"}
  - {field: "transactions.T1-T4 measure_start_end", source: "sample assumption supplied by Copilot, 2026-11-23"}
  - {field: "environment.test_windows", source: "sample assumption supplied by Copilot, 2026-11-23"}
  - {field: "abort_conditions", source: "proposed sample assumptions supplied by Copilot, 2026-11-23"}
