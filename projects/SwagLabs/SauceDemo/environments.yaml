# Copy to projects/<client>/<app>/environments.yaml. One block per environment you may test.
# Switch with: python tools/envconf.py use <project_dir> <name>      (or edit the 'active:' line)
# NEVER put passwords, tokens or keys here. List only the NAMES of the environment variables that hold them.
active: test
environments:
  test:
    description: "SauceDemo test environment"
    type: public
    base_url: "https://www.saucedemo.com/"
    owner: "Test lead"
    authorisation: accepted_by_test_lead
    authorisation_note: "Accepted by test lead in chat on 2026-11-23"
    max_vus: 5
    max_run_minutes: 30
    test_windows: "Sample assumption: off-peak 30-minute window"
    monitoring: {source: none, detail: ""}
    comparison_with_production: ""
    third_party_services: ""
    test_data: "Predefined SauceDemo test accounts; standard products in the public catalog; reset application state and shopping carts between runs"
    credentials_env_vars: [SAUCE_USERNAME, SAUCE_PASSWORD]
    known_differences: ""
    verified: {date: "2026-11-23", by: "tools/targetcheck.py", note: "1 of 1 read calls matched the catalogue (status and field names); 3 skipped (writes, logins or no value)"}
