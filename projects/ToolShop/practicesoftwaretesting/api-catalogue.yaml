flows:
  - {transaction: "T1", steps: ["API-001", "API-002", "API-003", "API-004"], parallel: ["API-001", "API-002", "API-003", "API-004"], note: "All four calls fire concurrently on page load (independent reads, no dependency chain between them) - the script should batch/fire them in parallel rather than sequentially."}
  - {transaction: "T2", steps: ["API-005"]}
  - {transaction: "T3", steps: ["API-006", "API-007"]}
notes:
  - "T4 (Add item to cart) and T5 (Checkout and place order) were NOT discovered in this pass: both are write actions and Testsmith's authorisation to interact with/load-test the public site is not yet confirmed (see brd.yaml open_items #1 and #4). No login, add-to-cart or checkout request was made or observed. These remain open items - see open-items.md."
  - "GET /users/me was observed returning 401 Unauthorized on every page load (guest/no session). It is a background auth-status check, not part of the T1-T3 business flows, so it is not listed as a catalogue API. Its actual auth mechanism (bearer token vs cookie) could not be confirmed without logging in, which was out of scope for this read-only, minimal discovery pass."
  - "API-004 and API-005 use the HTTP method 'QUERY' (a relatively new method for safe, body-bearing reads). Confirmed by capturing ALL request types (not just xhr/fetch) during a repeat search: no separate OPTIONS preflight appears, so QUERY is the literal wire method, not a mislabelled preflight. tools/catalogue.py's method validator was extended (user decision, 2026-11-18) to accept QUERY alongside GET/POST/PUT/PATCH/DELETE/HEAD/OPTIONS."
  - "On every page load, the site also calls https://practicesoftwaretesting.com/cdn-cgi/rum and https://practicesoftwaretesting.com/cdn-cgi/challenge-platform/... (same host as the static site, different purpose) and https://www.google-analytics.com/g/collect. These are Cloudflare RUM/bot-management and Google Analytics instrumentation, not application APIs, and are excluded from the catalogue. No CAPTCHA, block page, 429 or 503 was encountered during this discovery."
  - "The site footer reads 'v2.5' while the page title and brd.yaml record 'v5.0' for the same page - a discrepancy observed, not resolved; flagging for awareness only."
  - "meta.base_url was changed to http://localhost:8091 (2026-11-18, user decision) once the k6 run target moved from the public site to the test lead's own local Docker copy (see brd.yaml environment.target and open_items). All API entries above were discovered against the public site (https://api.practicesoftwaretesting.com) and each evidence.source still records that; the local copy's API has NOT been separately re-discovered or verified to match (same open item in brd.yaml) - it is assumed identical because it is described as a copy of the same application."
