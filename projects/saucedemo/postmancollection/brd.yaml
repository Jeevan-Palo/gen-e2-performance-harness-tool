abort_conditions:
- condition: Error rate
  threshold: '> 5% for 2 consecutive minutes'
  action: Stop the test and notify the environment owner
- condition: Response time
  threshold: p95 > 10 s for 2 consecutive minutes
  action: Stop the test
- condition: Throttling or blocking
  threshold: Any 429, 503 or WAF/CDN block response
  action: Stop immediately
- condition: Request from operations or environment owner
  threshold: Any stop request
  action: Stop immediately
