# Copy to projects/<client>/<app>/environments.yaml. One block per environment you may test.
# Switch with: python tools/envconf.py use <project_dir> <name>      (or edit the 'active:' line)
# NEVER put passwords, tokens or keys here. List only the NAMES of the environment variables that hold them.
active: local
environments:
  local:
    description: ""                  # e.g. Local Docker copy run by the test lead
    type: local                      # local | test | staging | production | public
    base_url: "http://localhost:8080"  # scheme://host[:port] of the API the script calls
    owner: ""                        # who owns the system
    authorisation: not_required      # not_required | confirmed_by_owner | accepted_by_test_lead | not_confirmed
    authorisation_note: ""           # who confirmed, how, when. Needed for accepted_by_test_lead
    max_vus: 50                      # hard cap for this environment (runs are refused above it)
    max_run_minutes: 20
    test_windows: ""
    monitoring: {source: none, detail: ""}    # docker_stats | azure | dynatrace | client_apm | none
    # docker_stats example: {source: docker_stats, detail: "CPU and memory of the app containers", containers: [app-api-1, app-db-1], interval_seconds: 5}
    # azure, dynatrace, client_apm: collectors not built yet
    comparison_with_production: ""
    third_party_services: ""
    test_data: ""                    # accounts and data needed here (no credentials)
    credentials_env_vars: []         # e.g. [APP_USER, APP_PASSWORD]  (names only)
    known_differences: ""            # known differences from the API catalogue / other environments
    verified: {date: "", by: "", note: ""}    # last check that this environment matches the catalogue
    run_plan:                        # approved once by the test lead so the end-to-end flow does not stop at every step
      approved_note: ""              # the test lead's own statement and date; the plan is used only when this is filled
      discovery_actions: []          # write actions allowed once each during browser discovery, e.g. [login, add to cart, checkout]
      load_steps: []                 # users per load run, in order, e.g. [2, 4, 5]; first <= 5, then at most 2x, never above max_vus
      ramp_up: 30s
      steady: 3m
      ramp_down: 30s
      pack_if_targets_missed: false  # true: a load run that completed but missed targets still goes into the report and client pack
  example-remote:
    description: ""
    type: staging
    base_url: "https://example.invalid"
    owner: ""
    authorisation: not_confirmed
    authorisation_note: ""
    max_vus: 5
    max_run_minutes: 20
    test_windows: ""
    monitoring: {source: none, detail: ""}
    comparison_with_production: ""
    third_party_services: ""
    test_data: ""
    credentials_env_vars: []
    known_differences: ""
    verified: {date: "", by: "", note: ""}
